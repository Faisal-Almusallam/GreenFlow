name: collect riyadh traffic

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: get traffic
        run: python riyadh_collector.py
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}

      - name: save to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/riyadh_traffic.csv
          git commit -m "riyadh traffic $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          git pull --rebase
          git push
